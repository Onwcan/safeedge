name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  # The gate that actually matters for this repository. SpscRing uses
  # acquire/release rather than seq_cst, and x86-64's strong memory model will
  # happily hide an incorrect pairing. TSan models the C++ abstract machine
  # instead of the host, so it catches what the hardware would forgive.
  # See docs/adr/0002-memory-ordering-policy.md.
  thread-sanitizer:
    name: ThreadSanitizer (memory ordering)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan -j "$(nproc)"
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset tsan

  address-sanitizer:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan -j "$(nproc)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset asan

  static-analysis:
    name: clang-tidy + clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18 clang-format-18
      - name: Check formatting
        # Runs the same script a developer runs, so the two cannot drift.
        # The previous inline find/xargs searched a directory that was empty
        # -- and therefore untracked, and absent on a fresh checkout -- so it
        # failed even when every file was correctly formatted.
        run: bash scripts/format.sh --check
      - name: clang-tidy
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Drive clang-tidy from CMake's database. Optional sources (currently
          # OPC UA) have no valid command when their component is disabled.
          python3 -c 'import json, pathlib; root = pathlib.Path("src").resolve(); entries = json.load(open("build/compile_commands.json", encoding="utf-8")); files = sorted({pathlib.Path(entry["file"]).resolve() for entry in entries}); print(*(str(path) for path in files if path.is_relative_to(root)), sep="\n")' \
            | xargs -r -d '\n' clang-tidy-18 -p build --warnings-as-errors='*'

  # Its own job, because it is its own decision.
  #
  # open62541 is a couple of minutes of build that the other jobs should not pay
  # for, and keeping it separate makes the claim checkable: if this job is the
  # only one that touches OPC UA, then nothing the other jobs build links it --
  # including safeedged, whose whole point is that it does not.
  opcua:
    name: OPC UA component
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14

      - name: Cache the open62541 build
        uses: actions/cache@v4
        with:
          path: build-opcua/_deps
          key: open62541-v1.4.12-${{ runner.os }}-g++14

      - name: Configure with the component enabled
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-opcua -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DSAFEEDGE_BUILD_OPCUA=ON             -DSAFEEDGE_OPCUA_ENCRYPTION=ON             -DSAFEEDGE_BUILD_BENCHMARKS=OFF             -DSAFEEDGE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-opcua -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build-opcua --output-on-failure

      # The structural claim, checked rather than asserted. safeedged must not
      # link open62541 -- that is the entire reason the OPC UA server is a
      # separate binary, and a stray target_link_libraries would undo it
      # silently.
      - name: safeedged links no OPC UA
        run: |
          if ldd build-opcua/safeedged 2>/dev/null | grep -qi open62541; then
            echo "safeedged is linked against open62541 -- the process boundary is gone" >&2
            exit 1
          fi
          if nm -C build-opcua/safeedged 2>/dev/null | grep -q "UA_Server_new"; then
            echo "safeedged contains open62541 symbols" >&2
            exit 1
          fi
          echo "safeedged carries no OPC UA code, as intended"

      # The whole point of the security work: a server built with encryption
      # must not still be offering plaintext. SecurityFixture covers it, and this
      # asserts the build actually has a crypto backend -- a build without one
      # would pass every other test while serving None to everybody.
      - name: The build has a crypto backend
        run: |
          if ! nm -C build-opcua/libsafeedge-opcua.a 2>/dev/null | grep -q "UA_CreateCertificate\|mbedtls"; then
            if ! grep -q "UA_ENABLE_ENCRYPTION" build-opcua/_deps/open62541-build/src_generated/open62541/config.h 2>/dev/null; then
              echo "the OPC UA component was built without encryption" >&2
              exit 1
            fi
          fi
          echo "encryption is compiled in"

      # Unit tests prove which configurations are refused. They cannot prove
      # that an untrusted client is turned away, because that happens inside
      # open62541 during the SecureChannel handshake, between two processes.
      # This runs the real server against two real clients -- one in the trust
      # list, one not -- and fails the build if the excluded one gets in.
      - name: A trust list actually keeps clients out
        run: bash scripts/demonstrate-client-auth.sh build-opcua build-opcua /tmp/auth-evidence

      # The claim that events carry transitions a sampled variable cannot. Both
      # subscriptions run in one client session against one server, so a
      # difference in what they report is a difference between the mechanisms
      # rather than between two runs of a machine. The script also asserts the
      # server itself coalesced nothing, because if it had, both subscriptions
      # would have lost the same transitions for the same reason and the
      # comparison would be measuring the wrong thing.
      - name: Events carry what a sampled variable drops
        run: bash scripts/demonstrate-events-vs-sampling.sh build-opcua build-opcua /tmp/auth-evidence

      - name: Upload OPC UA integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcua-integration-evidence
          path: /tmp/auth-evidence/
          if-no-files-found: warn

  install-consumer:
    name: installed package is consumable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSAFEEDGE_BUILD_TESTS=OFF -DSAFEEDGE_BUILD_BENCHMARKS=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/staged"
          cmake --build build -j "$(nproc)"
          cmake --install build
      - name: Compile a downstream consumer against the installed package
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOT'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(safeedge REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE
            safeedge::rt
            "$<LINK_LIBRARY:WHOLE_ARCHIVE,safeedge::rt_alloc_guard>")
          EOT
          cat > /tmp/consumer/main.cpp <<'EOT'
          // Exercises every public target, including the WHOLE_ARCHIVE link of
          // the allocation guard -- which is the part most likely to break
          // silently for a downstream consumer, since a normal link drops it.
          #include <cassert>
          #include <chrono>
          #include <cstdio>
          #include "safeedge/concurrent/spsc_ring.hpp"
          #include "safeedge/rt/cyclic_executor.hpp"
          #include "safeedge/rt/no_alloc_guard.hpp"
          int main() {
            using namespace safeedge::rt;
            assert(guardIsInstalled());

            safeedge::concurrent::SpscRing<int, 8> ring;
            assert(ring.tryPush(1));
            int out = 0;
            assert(ring.tryPop(out) && out == 1);

            CyclicExecutor::Config cfg;
            cfg.period = std::chrono::microseconds(200);
            CyclicExecutor exec(cfg);
            std::uint64_t cycles = 0;
            auto step = [&cycles](const CycleContext&) { ++cycles; };
            exec.run(CycleCallback(step), 25);
            assert(cycles == 25);
            assert(exec.stats().allocation_violations == 0);

            std::printf("consumer ok\n");
            return 0;
          }
          EOT
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/staged" -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer

  fuzz:
    name: fuzz the telegram decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Build fuzzer
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo                 -DSAFEEDGE_BUILD_FUZZERS=ON -DSAFEEDGE_BUILD_TESTS=OFF                 -DSAFEEDGE_BUILD_BENCHMARKS=OFF
          cmake --build build-fuzz -j "$(nproc)"
      - name: Fuzz
        # The decoder is the only place in this runtime that parses bytes it did
        # not produce, from a transport assumed to be untrustworthy. Sixty
        # seconds per push will not find everything, but it re-runs the seed
        # corpus every time, so a regression that breaks a known-good frame
        # fails immediately.
        run: |
          ./build-fuzz/fuzz/fuzz_telegram_decode             -max_total_time=60 -print_final_stats=1 fuzz/corpus
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: crash-*

  traceability:
    name: requirements traceability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check requirement links and matrix freshness
        # Fails if any requirement has no implementation link, no verification
        # link, if an annotation or FMEA row names a requirement that does not
        # exist, or if the committed matrix is stale.
        #
        # The unknown-id check is the one that matters: without it a typo such
        # as REQ-SAF-O23 (letter O for zero) verifies nothing, the gate still
        # passes, and the matrix reports coverage that does not exist.
        run: python3 scripts/traceability.py --check

  container:
    name: image builds, is small, and runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t safeedge:ci .

      - name: Enforce the image size budget
        # A scratch image holding one static binary has no reason to grow. If it
        # does, something has been added to the runtime stage -- a debug tool, a
        # shell "just for now" -- and the whole argument for this base collapses
        # quietly. Better to fail here than to discover it during an audit.
        run: |
          BYTES=$(docker image inspect safeedge:ci --format '{{.Size}}')
          BUDGET=$((8 * 1024 * 1024))
          echo "image size: $((BYTES / 1024)) KiB (budget $((BUDGET / 1024)) KiB)"
          if [ "$BYTES" -gt "$BUDGET" ]; then
            echo "::error::image exceeds the size budget"
            exit 1
          fi

      - name: Assert the image contains nothing but the binary
        # The claim this image makes is "no userland, so no userland
        # vulnerability". That claim is worth nothing unless it is checked.
        #
        # Checked by unpacking the image layers, NOT by exporting a container.
        # `docker export` includes files the *runtime* injects -- .dockerenv,
        # /etc/hosts, /etc/resolv.conf, /dev/console -- which are not in the
        # image at all. The first version of this step counted those and would
        # have failed on a perfectly correct image.
        run: |
          mkdir -p /tmp/imgcheck && cd /tmp/imgcheck
          docker save safeedge:ci -o img.tar
          tar -xf img.tar
          find . -path './blobs/*' -type f | while read -r blob; do
            tar -tf "$blob" 2>/dev/null | grep -v '/$' || true
          done | sort -u > contents.txt
          echo "--- image layer contents ---"
          cat contents.txt
          if [ "$(cat contents.txt)" != "safeedged" ]; then
            echo "::error::image contains more than the binary"
            exit 1
          fi

      - name: Vulnerability scan
        # A missing action ref fails the entire job during runner setup, before
        # checkout. This is the exact commit behind the signed, immutable
        # upstream release named in the comment.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: safeedge:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: safeedge:ci
          format: spdx-json
          output-file: safeedge-sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: safeedge-sbom.spdx.json

      - name: Smoke test the running container
        # Building an image proves it links. Running it proves the entrypoint
        # works, the port is reachable, the healthcheck passes and SIGTERM is
        # honoured -- none of which a build can tell you.
        run: |
          docker run -d --name smoke -p 9100:9100 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges safeedge:ci
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:9100/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9100/healthz
          curl -sf http://127.0.0.1:9100/readyz
          curl -sf http://127.0.0.1:9100/metrics | head -30

          echo "--- metrics must report that a fully hardened container has no RT scheduling ---"
          curl -sf http://127.0.0.1:9100/metrics \
            | grep -q '^safeedge_realtime_scheduling_granted 0'

          echo "--- SIGTERM must be honoured well inside the grace period ---"
          START=$(date +%s%3N)
          docker stop smoke
          ELAPSED=$(( $(date +%s%3N) - START ))
          echo "docker stop took ${ELAPSED} ms"
          if [ "$ELAPSED" -gt 5000 ]; then
            echo "::error::container did not shut down promptly on SIGTERM"
            exit 1
          fi
          docker rm smoke

      - name: Validate the compose package
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run
        # Not a gate. A shared GitHub runner is a virtualised, noisy-neighbour
        # environment, and failing a build on a latency number measured there
        # would be failing on someone else's workload. The benchmark prints its
        # own measurement conditions; the output is for reading, not asserting.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)" --target bench_spsc_ring
          ./build/benchmarks/bench_spsc_ring | tee benchmark-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.md
