name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  # The gate that actually matters for this repository. SpscRing uses
  # acquire/release rather than seq_cst, and x86-64's strong memory model will
  # happily hide an incorrect pairing. TSan models the C++ abstract machine
  # instead of the host, so it catches what the hardware would forgive.
  # See docs/adr/0002-memory-ordering-policy.md.
  thread-sanitizer:
    name: ThreadSanitizer (memory ordering)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan -j "$(nproc)"
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset tsan

  address-sanitizer:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan -j "$(nproc)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset asan

  static-analysis:
    name: clang-tidy + clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18 clang-format-18
      - name: Check formatting
        # Runs the same script a developer runs, so the two cannot drift.
        # The previous inline find/xargs searched a directory that was empty
        # -- and therefore untracked, and absent on a fresh checkout -- so it
        # failed even when every file was correctly formatted.
        run: bash scripts/format.sh --check
      - name: clang-tidy
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # Only .cpp files -- see note above.
          find src -name '*.cpp' 
            | xargs clang-tidy-18 -p build --warnings-as-errors='*'

  install-consumer:
    name: installed package is consumable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSAFEEDGE_BUILD_TESTS=OFF -DSAFEEDGE_BUILD_BENCHMARKS=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/staged"
          cmake --build build -j "$(nproc)"
          cmake --install build
      - name: Compile a downstream consumer against the installed package
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOT'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(safeedge REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE
            safeedge::rt
            "$<LINK_LIBRARY:WHOLE_ARCHIVE,safeedge::rt_alloc_guard>")
          EOT
          cat > /tmp/consumer/main.cpp <<'EOT'
          // Exercises every public target, including the WHOLE_ARCHIVE link of
          // the allocation guard -- which is the part most likely to break
          // silently for a downstream consumer, since a normal link drops it.
          #include <cassert>
          #include <chrono>
          #include <cstdio>
          #include "safeedge/concurrent/spsc_ring.hpp"
          #include "safeedge/rt/cyclic_executor.hpp"
          #include "safeedge/rt/no_alloc_guard.hpp"
          int main() {
            using namespace safeedge::rt;
            assert(guardIsInstalled());

            safeedge::concurrent::SpscRing<int, 8> ring;
            assert(ring.tryPush(1));
            int out = 0;
            assert(ring.tryPop(out) && out == 1);

            CyclicExecutor::Config cfg;
            cfg.period = std::chrono::microseconds(200);
            CyclicExecutor exec(cfg);
            std::uint64_t cycles = 0;
            auto step = [&cycles](const CycleContext&) { ++cycles; };
            exec.run(CycleCallback(step), 25);
            assert(cycles == 25);
            assert(exec.stats().allocation_violations == 0);

            std::printf("consumer ok
");
            return 0;
          }
          EOT
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/staged" -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer

  fuzz:
    name: fuzz the telegram decoder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Build fuzzer
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo                 -DSAFEEDGE_BUILD_FUZZERS=ON -DSAFEEDGE_BUILD_TESTS=OFF                 -DSAFEEDGE_BUILD_BENCHMARKS=OFF
          cmake --build build-fuzz -j "$(nproc)"
      - name: Fuzz
        # The decoder is the only place in this runtime that parses bytes it did
        # not produce, from a transport assumed to be untrustworthy. Sixty
        # seconds per push will not find everything, but it re-runs the seed
        # corpus every time, so a regression that breaks a known-good frame
        # fails immediately.
        run: |
          ./build-fuzz/fuzz/fuzz_telegram_decode             -max_total_time=60 -print_final_stats=1 fuzz/corpus
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: crash-*

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run
        # Not a gate. A shared GitHub runner is a virtualised, noisy-neighbour
        # environment, and failing a build on a latency number measured there
        # would be failing on someone else's workload. The benchmark prints its
        # own measurement conditions; the output is for reading, not asserting.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)" --target bench_spsc_ring
          ./build/benchmarks/bench_spsc_ring | tee benchmark-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.md
